[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msddn-modern"
version = "0.1.0"
description = "Compatibility-first refactor of MSDDN"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.10"]

[project.scripts]
msddn = "msddn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
